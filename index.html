<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pixel Shooter">
<meta name="theme-color" content="#05060d">
<title>Pixel Shooter</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <header id="hud" aria-label="Game status">
    <div class="hud-main">
      <div class="hud-stat hud-score"><span class="hud-label">Score</span><span id="score-display" class="hud-num">0</span></div>
      <div class="hud-stat hud-wave"><span class="hud-label">Wave</span><span id="wave-display" class="hud-num">1</span></div>
      <div id="lives-display" class="hud-lives" aria-label="Lives"></div>
      <div class="hud-actions">
        <button id="fs-btn" class="hud-btn" type="button" aria-label="Toggle fullscreen" title="Fullscreen" hidden>&#9974;</button>
        <button id="mute-btn" class="hud-btn" type="button" aria-label="Mute sound" title="Mute (M)">&#128266;</button>
        <button id="pause-hud-btn" class="hud-btn" type="button" aria-label="Pause" title="Pause (P)">&#10074;&#10074;</button>
      </div>
    </div>
    <div class="hud-sub">
      <span id="ability-display"></span>
      <span id="dodge-display"></span>
      <span id="shield-display"></span>
      <span id="boots-display"></span>
      <span id="upgrade-chips"></span>
    </div>
    <div id="wave-bar-wrap"><div id="wave-bar"></div></div>
  </header>

  <main id="stage">
    <div id="game-scale-wrap">
      <div id="game-box">
        <canvas id="canvas" width="760" height="580"></canvas>
        <div id="toast-stack"></div>
      </div>
    </div>
  </main>

  <div id="touch-controls">
    <div id="joy-move" class="joystick" aria-label="Move stick"><div class="joy-nub"></div></div>
    <div id="btn-cluster">
      <div id="dodge-btn" class="touch-btn dodge" role="button" aria-label="Dodge"><span class="tb-label">Dodge</span></div>
      <div id="ability-btn" class="touch-btn" role="button" aria-label="Ability"><span class="tb-label">Ability</span></div>
    </div>
    <div id="joy-aim" class="joystick" aria-label="Aim and fire stick"><div class="joy-nub"></div></div>
  </div>

</div>

<div id="overlay" role="dialog" aria-live="polite"></div>

<script src="js/storage.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/upgrades.js"></script>
<script src="js/ui.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
